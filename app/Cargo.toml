[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version = "0.8.9", features = ["default", "macros"]}
sqlx = {version="0.9.0", features = ["default", "runtime-tokio", "postgres", "sqlx-toml", "chrono"]}
tokio = {version = "1.53.2", features = ["default", "rt-multi-thread"]}
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = {version="0.3.23", features = ["env-filter"]}
serde = { version = "1.0", features = ["derive"] }
envy = "0.4"
thiserror = "2.0.21"
autoendpoint = { version = "0.1.0", path = "../autoendpoint" }
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0.151"
parking_lot = "0.12.5"
async-trait = "0.1.92"
